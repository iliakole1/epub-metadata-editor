<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Theorie-trainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M38 14h24l18 66H20z' fill='%23ff922b'/%3E%3Cpath d='M32 38h36l5 16H27z' fill='%23fff'/%3E%3Crect x='10' y='78' width='80' height='12' rx='5' fill='%23e8590c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #343a40; --soft: #868e96; --line: #e9ecef; --blue: #1c7ed6; --blue-d: #1864ab; --green: #40c057; --green-d: #2f9e44;
    --red: #fa5252; --red-d: #e03131; --gold: #fab005; --bg: #fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 800 17px/1.35 Nunito, ui-rounded, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; }
  button, input { font: inherit; color: inherit; }
  #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

  /* chunky buttons */
  .btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 14px 16px; cursor: pointer; font-weight: 900; letter-spacing: .02em;
    background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-d); transition: transform .06s, box-shadow .06s; text-transform: uppercase; font-size: 16px; }
  .btn:active { transform: translateY(4px); box-shadow: none; }
  .btn.green { background: var(--green); box-shadow: 0 4px 0 var(--green-d); }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
  .btn.ghost { background: #fff; color: var(--blue); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
  .btn:disabled { background: var(--line); color: #adb5bd; box-shadow: none; cursor: default; }

  /* home */
  .top { position: sticky; top: 0; z-index: 5; background: #fff; display: flex; align-items: center; gap: 14px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 2px solid var(--line); }
  .stat { display: flex; align-items: center; gap: 5px; font-weight: 900; }
  .stat.fire { color: #f76707; } .stat.xp { color: var(--gold); } .stat.off { color: #ced4da; filter: grayscale(1); }
  .goal { flex: 1; height: 16px; background: var(--line); border-radius: 8px; overflow: hidden; position: relative; }
  .goal i { display: block; height: 100%; background: linear-gradient(#ffd43b, #fab005); border-radius: 8px; transition: width .5s; }
  .goal span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; color: #5c4a00; }
  .iconbtn { border: 0; background: none; font-size: 20px; cursor: pointer; padding: 2px 4px; }
  .hello { display: flex; align-items: center; gap: 12px; padding: 16px 16px 4px; }
  .bubble { position: relative; flex: 1; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 800; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; width: 14px; height: 14px; margin-top: -7px; background: #fff;
    border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
  .theme { margin: 18px 16px 0; }
  .banner { border-radius: 16px; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 70%, #000);
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 14px, transparent 14px 28px), linear-gradient(160deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c)); }
  .banner .ic { width: 46px; height: 46px; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.22); border-radius: 50%; }
  .banner .ic { font-size: 24px; } .banner h2 { margin: 0; font-size: 20px; font-weight: 900; } .banner small { opacity: .85; font-weight: 800; }
  .banner .pct { margin-left: auto; font-weight: 900; }
  .path { display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 44px 0 10px; }
  .node { width: 72px; height: 66px; flex: none; padding: 0; border-radius: 50%; border: 0; cursor: pointer; font-size: 26px; font-weight: 900; color: #fff;
    background: var(--c); box-shadow: 0 7px 0 rgba(0,0,0,.22), inset 0 -3px 0 rgba(0,0,0,.08); position: relative; transition: transform .06s, box-shadow .06s; }
  .node:active { transform: translateY(6px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
  .node.done { background: var(--gold); }
  .node.locked { background: #dee2e6; color: #adb5bd; box-shadow: 0 7px 0 #ced4da; cursor: default; }
  .node.now::after { content: "START"; position: absolute; left: 50%; top: -30px; transform: translateX(-50%); background: #fff; color: var(--c);
    border: 2px solid var(--line); border-radius: 10px; padding: 2px 10px; font-size: 13px; animation: bob 1.2s ease-in-out infinite; white-space: nowrap; }
  @keyframes bob { 50% { transform: translate(-50%, -5px); } }
  /* het pad: weg, decor, bijzondere knopen */
  .path { position: relative; }
  .road { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .deco { position: absolute; z-index: 0; font-size: 26px; line-height: 1; pointer-events: none; animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
  .deco:nth-of-type(odd) { animation-delay: -2s; }
  .deco.here { animation: hop 1.6s ease-in-out infinite; z-index: 2; }
  @keyframes sway { 50% { transform: rotate(4deg); } }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-9px); } }
  .node { z-index: 1; }
  .node.now::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--c); opacity: .35; animation: ring 1.8s ease-out infinite; }
  @keyframes ring { from { transform: scale(.85); opacity: .5; } to { transform: scale(1.25); opacity: 0; } }
  .node.special { border-radius: 22px; width: 68px; height: 64px; font-size: 28px; }
  .node.special.fresh, .node.special.ready { animation: wiggle 2.4s ease-in-out infinite; }
  .node.special.locked { filter: grayscale(1); opacity: .75; }
  .node.special.opened { background: #fff3bf; box-shadow: 0 7px 0 #ffe066; cursor: default; }
  .node.special.played { background: color-mix(in srgb, var(--c) 70%, #fff); }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-9deg); } 84% { transform: rotate(8deg); } 92% { transform: rotate(-4deg); } }
  /* mascotte */
  .pion { overflow: visible; }
  .pion * { transform-box: fill-box; }
  .pion .body { transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.025, .972); } }
  .pion .eyes { transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 44%, 48%, 92%, 100% { transform: scaleY(1); } 46%, 94%, 96% { transform: scaleY(.08); } }
  .pion .look { transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform .25s ease-out; animation: glance 9s ease-in-out infinite; }
  @keyframes glance { 0%, 20%, 34%, 60%, 74%, 100% { translate: 0 0; } 24%, 30% { translate: -1.6px .3px; } 64%, 70% { translate: 1.6px -.4px; } }
  .pion .arm { transform-origin: 20% 100%; } .pion .armL { transform-origin: 90% 0%; }
  .pion .arm.wave { transform-origin: 0% 100%; animation: wave 5.5s ease-in-out infinite; }
  @keyframes wave { 0%, 62%, 100% { transform: rotate(18deg); } 68%, 80%, 92% { transform: rotate(-22deg); } 74%, 86% { transform: rotate(8deg); } }
  .pion .arm.up { animation: cheer .45s ease-in-out infinite alternate; } .pion .armR.up { transform-origin: 0% 100%; } .pion .armL.up { transform-origin: 100% 100%; }
  @keyframes cheer { to { transform: rotate(14deg); } } .pion .armL.up { animation-name: cheerL; } @keyframes cheerL { to { transform: rotate(-14deg); } }
  .pion.m-sad .body { animation: droop 2.6s ease-in-out infinite; } @keyframes droop { 50% { transform: scale(1.02, .95) rotate(-2deg); } }
  .pion .tear { animation: tear 2.2s ease-in infinite; } @keyframes tear { 0% { opacity: 0; transform: translateY(-3px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(16px); } }
  .pion.m-think .look { animation: none; transform: translate(1.4px, -1.6px); }
  .pion .shadow { transform-origin: center; }
  .hello .pion, .deco.here .pion { animation: hopq 2.8s ease-in-out infinite; }
  .deco.here { animation: none; }
  @keyframes hopq { 0%, 55%, 100% { transform: translateY(0); } 62% { transform: translateY(2px) scale(1.06, .92); } 74% { transform: translateY(-11px) scale(.96, 1.06); } 86% { transform: translateY(0) scale(1.05, .94); } 92% { transform: scale(1); } }
  #pet { cursor: pointer; display: inline-block; } #pet.poke .pion { animation: poke .6s cubic-bezier(.3, 1.5, .5, 1); }
  @keyframes poke { 0% { transform: scale(1); } 25% { transform: scale(1.18, .8); } 55% { transform: translateY(-20px) scale(.9, 1.14) rotate(-10deg); } 80% { transform: scale(1.08, .92) rotate(6deg); } 100% { transform: none; } }
  .finish .pion { animation: jump .8s cubic-bezier(.3, 1.4, .5, 1) 3; transform-origin: 50% 100%; }
  @keyframes jump { 0%, 100% { transform: none; } 15% { transform: scale(1.12, .84); } 45% { transform: translateY(-38px) scale(.94, 1.1) rotate(-8deg); } 75% { transform: translateY(0) scale(1.08, .9) rotate(4deg); } }
  .finish .card { animation: rise .4s both; } .finish .card:nth-child(2) { animation-delay: .12s; } .finish .card:nth-child(3) { animation-delay: .24s; }
  .sheet h4 .pion { vertical-align: -8px; }
  /* vragen komen binnenglijden */
  #qwrap > * { animation: rise .28s both; } #qwrap > :nth-child(2) { animation-delay: .05s; } #qwrap > :nth-child(3) { animation-delay: .1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .bar i { position: relative; overflow: hidden; }
  .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); animation: shine 2.2s linear infinite; }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .bar.timer i { width: 100%; background: linear-gradient(#b197fc, #7048e8); transform-origin: 0 50%; animation: drain linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }
  .combotoast { position: fixed; left: 50%; top: 22%; z-index: 40; transform: translateX(-50%); background: #fff4e6; color: #e8590c; border: 2px solid #ffc078; border-radius: 16px;
    padding: 8px 18px; font-size: 22px; font-weight: 900; pointer-events: none; animation: toast 1.5s ease-out forwards; white-space: nowrap; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 30% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
  /* winkel en boosts */
  .coinbtn { border: 2px solid #ffe066; background: #fff9db; border-radius: 12px; padding: 3px 9px; cursor: pointer; font: inherit; font-weight: 900; }
  .pill { background: #fff4e6; border: 2px solid #ffc078; color: #e8590c; border-radius: 14px; padding: 9px 12px; text-align: center; font-size: 15px; }
  .sitem { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .sic { width: 50px; height: 50px; flex: none; display: grid; place-items: center; font-size: 24px; background: #f1f3f5; border-radius: 14px; white-space: nowrap; }
  .sinfo { flex: 1; min-width: 0; } .sinfo b { display: block; } .sinfo small { display: block; font-weight: 600; color: var(--soft); font-size: 14px; line-height: 1.3; }
  .sinfo em { font-style: normal; font-size: 13px; color: var(--green-d); }
  .sbuy { width: auto; flex: none; padding: 9px 12px; font-size: 14px; text-transform: none; white-space: nowrap; }
  .skins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .skin { border: 2px solid var(--line); border-radius: 16px; padding: 22px 10px 12px; display: grid; justify-items: center; gap: 8px; text-align: center; }
  .skin.on { border-color: var(--green); background: #ebfbee; }
  .wearing { color: var(--green-d); font-size: 14px; padding: 9px 0; }
  .hintbtn { margin-top: 14px; border: 2px dashed #ffd43b; background: #fff9db; color: #a56a00; border-radius: 14px; padding: 9px 14px; cursor: pointer; font: inherit; font-size: 15px; }
  .opt.gone { opacity: .3; text-decoration: line-through; pointer-events: none; }
  /* theorieboek */
  .extra.duo { grid-template-columns: 1fr 1fr; padding-top: 14px; } .extra.duo .btn { padding: 12px 6px; font-size: 14px; }
  .bookbtn { background: #0c8599; box-shadow: 0 4px 0 #095c69; }
  h3.cat { font-size: 16px; color: var(--soft); text-transform: uppercase; letter-spacing: .05em; margin: 20px 0 10px; }
  .shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { text-align: left; border: 2px solid var(--line); border-top: 6px solid var(--c); background: #fff; border-radius: 16px; padding: 12px; cursor: pointer; display: grid; gap: 3px;
    box-shadow: 0 3px 0 var(--line); font: inherit; opacity: .78; } .tile.cov { opacity: 1; }
  .tile:active { transform: translateY(3px); box-shadow: none; }
  .tic { width: 42px; height: 42px; display: grid; place-items: center; font-size: 22px; border-radius: 50%; background: color-mix(in srgb, var(--c) 16%, #fff); }
  .tile small { font-weight: 600; color: var(--soft); font-size: 12.5px; } .tile em { font-style: normal; font-size: 12.5px; color: var(--soft); } .tile.cov em { color: var(--green-d); }
  .bhero { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; color: #fff; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c)); }
  .bhero .tic { background: rgba(255,255,255,.25); flex: none; } .bhero h2 { margin: 0; font-size: 22px; font-weight: 900; } .bhero small { opacity: .9; }
  .brow2 { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font: inherit; }
  .brow2 > span:nth-child(2) { flex: 1; min-width: 0; } .brow2 b { display: block; } .brow2 small { display: block; font-weight: 600; color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow2 i { font-style: normal; font-size: 22px; color: #adb5bd; }
  .thumb { width: 48px; height: 48px; flex: none; display: grid; place-items: center; font-size: 24px; background: #f1f3f5; border-radius: 12px; overflow: hidden; }
  .thumb svg.sign { width: 38px; height: 38px; } .thumb svg.scene { width: 48px; height: 48px; border: 0; border-radius: 0; } .thumb .num { font-weight: 900; color: var(--soft); }
  .btitle { font-size: 26px; font-weight: 900; margin: 6px 0 14px; }
  .bimgs { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; background: #f8f9fa; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .bimgs svg.sign { width: 84px; height: 84px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); } .bimgs svg.scene { width: min(100%, 250px); border-radius: 14px; }
  .btext { font-weight: 600; font-size: 18px; line-height: 1.55; margin: 0 0 14px; }
  .bex { border-left: 6px solid #fab005; background: #fff9db; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; } .bex b { color: #a56a00; } .bex p { margin: 4px 0 0; font-weight: 600; line-height: 1.5; }
  .bfacts { border: 2px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; } .bfacts > b { display: block; padding: 10px 14px 0; color: var(--blue-d); }
  .bfacts > div { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); } .bfacts > div:first-of-type { border-top: 0; }
  .bfacts span { flex: 1; font-weight: 600; font-size: 15px; } .bfacts strong { flex: none; max-width: 46%; text-align: right; color: var(--blue-d); }
  .bsign { display: flex; gap: 14px; align-items: center; border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .bsign svg.sign { width: 66px; height: 66px; flex: none; } .bsign p { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.4; }
  .bcase { border: 2px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; display: grid; gap: 6px; }
  .bcase .pic { margin: 0 0 6px; } .bcase .pic svg.sign { width: 90px; height: 90px; } .bcase .pic svg.scene { width: min(100%, 230px); }
  .bcase .ans { color: var(--green-d); } .bcase .ans::before { content: "✓ "; } .bcase p { margin: 0; font-weight: 600; font-size: 15px; color: var(--soft); line-height: 1.4; }
  .bnav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* proefexamen */
  .exambtn { background: #343a40; box-shadow: 0 4px 0 #111; } .exambtn small { display: block; font-size: 12px; opacity: .75; text-transform: none; }
  .exres { font-size: 30px; font-weight: 900; margin: 6px 0 4px; } .exres.ok { color: var(--green-d); } .exres.no { color: var(--red-d); }
  .expart { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .expart span { grid-column: 1; font-weight: 600; font-size: 14px; color: var(--soft); } .expart em { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-style: normal; font-size: 14px; }
  .expart.ok { border-color: #b2f2bb; } .expart.ok em { color: var(--green-d); } .expart.no { border-color: #ffc9c9; } .expart.no em { color: var(--red-d); }
  .exbar { grid-column: 1 / -1; position: relative; height: 12px; background: var(--line); border-radius: 6px; margin-top: 8px; }
  .exbar i { display: block; height: 100%; border-radius: 6px; background: var(--red); } .expart.ok .exbar i { background: var(--green); }
  .exbar u { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
  .exwrong { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 4px; }
  .exwrong span { font-size: 15px; } .exwrong .no { color: var(--red-d); } .exwrong .ok { color: var(--green-d); } .exwrong p { margin: 2px 0 0; font-weight: 600; font-size: 14px; color: var(--soft); }
  .exwrong .pic { margin: 6px 0; } .exwrong .pic svg.sign { width: 70px; height: 70px; }
  /* memory */
  .memory { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mcard { height: 104px; border: 0; background: none; padding: 0; cursor: pointer; perspective: 600px; }
  .mi { position: relative; display: block; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
  .mcard.up .mi { transform: rotateY(180deg); }
  .mf, .mb { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 6px 8px; text-align: center; font-size: 15px; }
  .mf { background: linear-gradient(160deg, #9775fa, #7048e8); color: #fff; font-size: 34px; font-weight: 900; box-shadow: 0 4px 0 #5f3dc4; }
  .mb { background: #fff; border: 2px solid var(--line); transform: rotateY(180deg); box-shadow: 0 4px 0 var(--line); }
  .mb svg.sign { width: 62px; height: 62px; }
  .mcard.found .mb { border-color: var(--green); background: #ebfbee; box-shadow: 0 4px 0 #b2f2bb; animation: pop .3s; }
  /* schatkist */
  .bigchest { font-size: 96px; line-height: 1.1; cursor: pointer; display: inline-block; animation: wiggle 1.4s ease-in-out infinite; }
  .bigchest.open { animation: pop .4s; cursor: default; }
  .chestxp { font-size: 34px; font-weight: 900; color: var(--gold); margin: 0 0 14px; animation: rise .4s both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .extra { padding: 8px 16px 0; display: grid; gap: 10px; }
  .foot { color: var(--soft); font-size: 13px; font-weight: 600; padding: 22px 20px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
  .foot button { border: 0; background: none; color: var(--blue); text-decoration: underline; cursor: pointer; font-weight: 800; font-size: 13px; }

  /* lesson */
  .lhead { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
  .bar { flex: 1; height: 16px; background: var(--line); border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(#69db7c, #40c057); border-radius: 8px; transition: width .4s; }
  .combo { font-weight: 900; color: #f76707; min-width: 44px; text-align: right; }
  .qwrap { flex: 1; padding: 6px 16px 180px; }
  .qwrap h3 { font-size: 20px; font-weight: 900; margin: 10px 0 12px; }
  .pic { display: grid; place-items: center; margin: 4px 0 14px; }
  .pic svg.sign { width: 130px; height: 130px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.2)); }
  .pic svg.scene { width: min(100%, 300px); border-radius: 18px; border: 2px solid var(--line); }
  .opts { display: grid; gap: 10px; }

<body>
<div id="app"></div>
<script src="questions.js?v=2"></script>
<script src="questions2.js?v=2"></script>

<script src="questions5.js?v=1"></script>

<script>
(() => {
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const THEMES = window.THEMES;
const THEORY = window.THEORY || {}, EXTRA = window.EXTRA || {};
const ALL = Object.fromEntries(THEMES.flatMap(t => [...t.qs, ...(EXTRA[t.id] || [])].map(q => [q.id, q])));
const LESSON_SIZE = 8, DAILY_GOAL = 50;

// ---------- Opslag (alleen op dit apparaat) ----------
const KEY = 'theorie-v1';
let S = { xp: 0, days: {}, done: {}, q: {}, flags: [], sp: {}, best: {}, owned: {}, buy: {}, use: {}, frozen: {}, skin: 'classic', ex: {}, mute: false };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (_) {}
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
const save = () => { saveLocal(); schedulePush(); };

// ---------- Voortgang ook in de cloud (zelfde Firebase-project als het Sinterklaasboek, eigen vak 'theorie') ----------
// Eén gebruiker, geen login. Werkt het niet (geen internet, regels nog niet gepubliceerd), dan blijft alles lokaal werken.
const CLOUD = 'https://sinterklaas-d0541-default-rtdb.europe-west1.firebasedatabase.app/theorie/state.json';
let cloud = 'bezig', pushTimer = 0;
const cloudText = () => cloud === 'ok' ? '☁️ Voortgang wordt op al je apparaten bewaard.' : cloud === 'bezig' ? '☁️ Voortgang ophalen…' : '📱 Voortgang staat alleen op dit apparaat (cloud niet bereikbaar).';
const setCloud = c => { cloud = c; const el = document.getElementById('cloud'); if (el) el.textContent = cloudText(); };
// Samenvoegen zodat niets verloren gaat: per dag de hoogste XP, per thema de verste les, per vraag de laatste stand.
function mergeState(R) {
  if (!R || typeof R !== 'object') return;
  for (const [d, v] of Object.entries(R.days || {})) S.days[d] = Math.max(S.days[d] || 0, +v || 0);
  S.xp = Object.values(S.days).reduce((a, b) => a + b, 0);
  for (const [t, v] of Object.entries(R.done || {})) S.done[t] = Math.max(S.done[t] || 0, +v || 0);
  for (const [id, v] of Object.entries(R.q || {})) { const mine = S.q[id]; if (!mine || (v.t || 0) > (mine.t || 0)) S.q[id] = v; }
  S.flags = [...new Set([...(S.flags || []), ...Object.values(R.flags || {})])];
  for (const k of Object.keys(R.sp || {})) S.sp[k] = true;
  for (const [k, v] of Object.entries(R.best || {})) S.best[k] = Math.max(S.best[k] || 0, +v || 0);
  // winkel: wat je hebt gekocht en gebruikt gaat nooit verloren (per stuk het hoogste aantal)
  for (const k of Object.keys(R.owned || {})) S.owned[k] = true;
  for (const f of ['buy', 'use']) for (const [k, v] of Object.entries(R[f] || {})) S[f][k] = Math.max(S[f][k] || 0, +v || 0);
  for (const k of Object.keys(R.frozen || {})) S.frozen[k] = true;
  for (const [k, v] of Object.entries(R.ex || {})) S.ex[k] = Math.max(S.ex[k] || 0, +v || 0);
  if (S.skin === 'classic' && R.skin && (R.skin === 'classic' || S.owned[R.skin])) S.skin = R.skin;
}
const FIELDS = ['xp', 'days', 'done', 'q', 'flags', 'sp', 'best', 'owned', 'buy', 'use', 'frozen', 'skin', 'ex'];
const cloudBody = (o = S) => JSON.stringify(Object.fromEntries(FIELDS.map(f => [f, o ? o[f] : undefined])));
async function push() {
  try { const r = await fetch(CLOUD, { method: 'PUT', body: cloudBody() }); setCloud(r.ok ? 'ok' : 'uit'); } catch (_) { setCloud('uit'); }
}
function schedulePush() { clearTimeout(pushTimer); pushTimer = setTimeout(push, 1200); }
async function pull() {
  try {
    const r = await fetch(CLOUD); if (!r.ok) throw 0;
    const R = await r.json(), before = cloudBody();
    mergeState(R); saveLocal(); setCloud('ok');
    applyFreeze(); if (cloudBody() !== cloudBody(R || {})) push();
    if (cloudBody() !== before && document.querySelector('.top')) home();      // startscherm bijwerken met wat er binnenkwam
  } catch (_) { setCloud('uit'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); else if (pushTimer) { clearTimeout(pushTimer); pushTimer = 0; push(); } });
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayXp = () => S.days[dayKey()] || 0;
function streak() {
  let n = 0; const d = new Date();
  if (!S.days[dayKey(d)]) d.setDate(d.getDate() - 1);          // vandaag nog niet geoefend: reeks loopt nog
  while (S.days[dayKey(d)] || S.frozen[dayKey(d)]) { if (S.days[dayKey(d)]) n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- Winkel: munten = verdiende XP min wat je hebt uitgegeven ----------
const SKINS = [
  { id: 'classic', name: 'Pion', price: 0, body: '#ff922b', base: '#e8590c' },
  { id: 'feest', name: 'Feest-Pion', price: 150, body: '#f06595', base: '#c2255c', acc: 'feest' },
  { id: 'cool', name: 'Coole Pion', price: 200, body: '#ff922b', base: '#e8590c', acc: 'bril' },
  { id: 'agent', name: 'Agent Pion', price: 300, body: '#339af0', base: '#1864ab', acc: 'pet' },
  { id: 'kerst', name: 'Kerst-Pion', price: 300, body: '#e03131', base: '#2f9e44', acc: 'muts' },
  { id: 'ninja', name: 'Ninja-Pion', price: 400, body: '#495057', base: '#212529', acc: 'band' },
  { id: 'regenboog', name: 'Regenboog-Pion', price: 500, body: 'url(#rb)', base: '#7048e8' },
  { id: 'koning', name: 'Koning Pion', price: 800, body: '#fcc419', base: '#e67700', acc: 'kroon' },
];
const BOOSTS = [
  { id: 'dbl', icon: '✖️2', name: 'Dubbele XP', price: 80, desc: 'Je volgende les levert twee keer zo veel XP op.' },
  { id: 'hint', icon: '💡', name: 'Hint', price: 25, desc: 'Streept bij een meerkeuzevraag één fout antwoord weg.' },
  { id: 'freeze', icon: '🧊', name: 'Reeksbevriezing', price: 150, desc: 'Sla je een dag over, dan blijft je reeks staan.' },
];
const inv = id => (S.buy[id] || 0) - (S.use[id] || 0);
const spent = () => SKINS.reduce((a, k) => a + (S.owned[k.id] ? k.price : 0), 0) + BOOSTS.reduce((a, b) => a + (S.buy[b.id] || 0) * b.price, 0);
const coins = () => S.xp - spent();
// Een gemiste dag (of een paar) dekken met reeksbevriezingen, als er daarvóór een reeks liep.
function applyFreeze() {
  const d = new Date(); d.setDate(d.getDate() - 1); const gap = [];
  while (!S.days[dayKey(d)] && !S.frozen[dayKey(d)] && gap.length < 5) { gap.push(dayKey(d)); d.setDate(d.getDate() - 1); }
  if (!gap.length || gap.length > inv('freeze') || !(S.days[dayKey(d)] || S.frozen[dayKey(d)])) return;
  gap.forEach(k => { S.frozen[k] = true; }); S.use.freeze = (S.use.freeze || 0) + gap.length; saveLocal();
}
// ---------- Herhaling (spaced repetition) ----------
// Na elk goed antwoord op rij duurt het langer voor een vraag terugkomt: 1, 3, 7, 14, 30 dagen.
const REV_DAYS = [0, 1, 3, 7, 14, 30];
const seenPool = () => THEMES.flatMap(t => lessonsOf(t).slice(0, S.done[t.id] || 0).flat()).filter(q => S.q[q.id]);
const dueScore = q => { const st = S.q[q.id]; if (st.w > 0 && (st.r || 0) < 2) return 1000;      // nog niet goed genoeg: eerst
  return (Date.now() - (st.t || 0)) / 864e5 / REV_DAYS[Math.min(st.r || 0, 5)]; };               // ≥ 1 = aan de beurt
const dueCount = () => seenPool().filter(q => dueScore(q) >= 1).length;
// De n vragen die het hardst aan herhaling toe zijn; zijn er te weinig aan de beurt, dan de langst niet geziene.
function pickReview(n, exclude) {
  const pool = seenPool().filter(q => !exclude.has(q.id));
  const due = shuffle(pool.filter(q => dueScore(q) >= 1)).sort((a, b) => dueScore(b) - dueScore(a));
  const rest = pool.filter(q => dueScore(q) < 1).sort((a, b) => (S.q[a.id].t || 0) - (S.q[b.id].t || 0));
  return [...due, ...rest].slice(0, n);
}
const weakIds = () => Object.keys(S.q).filter(id => ALL[id] && S.q[id].w > 0 && (S.q[id].r || 0) < 2);
// Lessen volgen de theorie: een les bestaat uit een of meer kaartjes plus precies de vragen die daarbij horen
// (zie lessons.js). Eerst uitleg, dan pas vragen. Heeft een kaartje veel vragen, dan wordt het over meer lessen
// verdeeld en krijg je het kaartje opnieuw te zien.
const PLAN = window.PLAN || {}, lessonCache = {};
const lessonsOf = t => {
  if (lessonCache[t.id]) return lessonCache[t.id];
  const plan = PLAN[t.id], ls = [], byId = Object.fromEntries([...t.qs, ...(EXTRA[t.id] || [])].map(q => [q.id, q]));
  if (!plan) { const l = t.qs.slice(); l.cards = (THEORY[t.id] || []).map((_, i) => i); return lessonCache[t.id] = [l]; }
  // elke vraag onthoudt bij welk kaartje hij hoort; een les toont de kaartjes van zijn eigen vragen
  // (plus kaartjes zonder vragen die er vlak voor komen), of de vaste set uit RECAP
  const fixed = (window.RECAP || {})[t.id];
  const flush = (pend, items) => { const l = items.map(x => x.q); l.cards = fixed || [...new Set([...pend, ...items.map(x => x.c)])].sort((a, b) => a - b); ls.push(l); };
  let pend = [], qs = [];
  plan.forEach((ids, i) => {
    pend.push(i); qs.push(...ids.map(id => byId[id]).filter(Boolean).map(q => ({ q, c: i })));
    while (qs.length >= 13) { flush(pend, qs.splice(0, Math.ceil(qs.length / Math.ceil(qs.length / 9)))); pend = []; }
    if (qs.length >= 6) { flush(pend, qs); pend = []; qs = []; }
  });
  if (qs.length) { if (qs.length < 4 && ls.length) { const last = ls[ls.length - 1]; last.push(...qs.map(x => x.q)); last.cards = fixed || [...new Set([...last.cards, ...pend, ...qs.map(x => x.c)])]; } else flush(pend, qs); }
  return lessonCache[t.id] = ls;
};
const cardsFor = (t, i) => ((lessonsOf(t)[i] || {}).cards || []).map(k => (THEORY[t.id] || [])[k]).filter(Boolean);

// ---------- Geluid ----------
const Sound = (() => {
  let ctx;
  const ac = () => { if (S.mute) return null; if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  const tone = (f, t0, dur, type = 'sine', gain = .18) => { const c = ac(); if (!c) return; const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05); };
  return {
    good() { tone(660, 0, .12, 'triangle'); tone(990, .09, .22, 'triangle'); },
    bad() { tone(196, 0, .16, 'sawtooth', .1); tone(147, .13, .28, 'sawtooth', .1); },
    tap() { tone(520, 0, .05, 'triangle', .08); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .3, 'triangle')); },
  };
})();

// ---------- Mascotte: Pion de pylon ----------
const ACC = {
  feest: '<path d="M50-16L62 13H38z" fill="#7048e8"/><path d="M45-4l12 5M42 5l18 6" stroke="#ffd43b" stroke-width="3"/><circle cx="50" cy="-17" r="4.5" fill="#ffd43b"/>',
  bril: '<path d="M30 37h40v5q0 8-8 8h-4q-6 0-7-7h-2q-1 7-7 7h-4q-8 0-8-8z" fill="#212529"/><path d="M36 40l5 0M56 40l5 0" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>',
  pet: '<path d="M34 13q16-16 32 0v3H34z" fill="#1c3f7a"/><path d="M30 15h44q2 4-4 5H34q-6-1-4-5z" fill="#102a54"/><circle cx="50" cy="8" r="3.2" fill="#ffd43b"/>',
  muts: '<path d="M36 14Q44-14 70-6Q58-2 64 14z" fill="#e03131"/><rect x="32" y="9" width="36" height="9" rx="4.5" fill="#fff" stroke="#ced4da" stroke-width="1.2"/><circle cx="71" cy="-6" r="5.5" fill="#fff" stroke="#ced4da" stroke-width="1.2"/>',
  band: '<path d="M34 26h32l2 8H32z" fill="#c92a2a"/><path d="M66 28l14-5-3 8zM66 31l12 5-8 3z" fill="#c92a2a"/>',
  kroon: '<path d="M35 13L33-7l9 9 8-13 8 13 9-9-2 20z" fill="#ffd43b" stroke="#e67700" stroke-width="1.5" stroke-linejoin="round"/><circle cx="50" cy="6" r="2.6" fill="#e03131"/><circle cx="40" cy="8" r="1.8" fill="#1c7ed6"/><circle cx="60" cy="8" r="1.8" fill="#1c7ed6"/>',
};
// Pion: meer detail (schaduw, glans, armpjes, wangen, wenkbrauwen) en stemmingen: happy, sad, excited, think.
const pion = (size = 64, mood = 'happy', skinId = S.skin) => { const k = SKINS.find(x => x.id === skinId) || SKINS[0], K = '#343a40';
  const eye = x => `<g transform="translate(${x} 42)"><circle r="5.4" fill="${K}"/><circle cx="1.7" cy="-1.8" r="1.9" fill="#fff"/><circle cx="-1.6" cy="1.9" r=".9" fill="#fff" opacity=".8"/></g>`;
  const eyes = k.acc === 'bril' ? '' : `<g class="look"><g class="eyes">${eye(42)}${eye(58)}</g></g>`;
  const brows = k.acc === 'bril' || k.acc === 'band' ? '' : mood === 'sad' ? `<path d="M36 33l9-3M64 33l-9-3" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>`
    : mood === 'excited' ? `<path d="M37 30q5-4 9-1M63 30q-5-4-9-1" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>`
    : mood === 'think' ? `<path d="M37 32l9-1M54 28q5-3 9 1" fill="none" stroke="${K}" stroke-width="2.2" stroke-linecap="round"/>` : '';
  const mouth = mood === 'sad' ? `<path d="M43 58q7-6 14 0" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`
    : mood === 'excited' ? `<path d="M40 52q10 15 20 0z" fill="${K}"/><path d="M45 58q5-3 10 0q-5 5-10 0z" fill="#ff8787"/>`
    : mood === 'think' ? `<ellipse cx="53" cy="56" rx="3.2" ry="3.6" fill="${K}"/>`
    : `<path d="M42 53q8 10 16 0z" fill="${K}"/><path d="M46 57.5q4-2.4 8 0q-4 3.4-8 0z" fill="#ff8787"/>`;
  const arm = (cls, d, hx, hy) => `<g class="arm ${cls}"><path d="${d}" fill="none" stroke="${k.base}" stroke-width="5" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="4" fill="${k.base}"/></g>`;
  const up = mood === 'excited';
  return `<svg class="pion m-${mood}" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">

      + ((sc.yield || '').includes(a) ? [0, 1, 2, 3].map(i => `<polygon points="${153 + i * 8.5},192 ${161 + i * 8.5},192 ${157 + i * 8.5},202" fill="#fff"/>`).join('') : '') + `</g>`;

    if (v.k === 'tram') return `<rect x="-12" y="-19" width="24" height="86" rx="6" fill="#f5c400" stroke="#0004"/><rect x="-9" y="-14" width="18" height="9" rx="2" fill="#cfe8ff"/>${[4, 22, 40].map(y => `<rect x="-9" y="${y}" width="18" height="12" rx="2" fill="#fff8" />`).join('')}`;

      + (v.k === 'you' ? `<text transform="rotate(${-ROT[v.f]})" y="7" text-anchor="middle" font-family="Arial" font-weight="700" font-size="8" fill="#fff">JIJ</text>` : '');

      cars += `<g data-car="${v.id}" data-ped="${v.at.join(',')},${v.to.join(',')}" transform="translate(${v.at[0]},${v.at[1]})"><ellipse rx="9" ry="5" fill="#f08c00" stroke="#212529" stroke-width="1.2"/><circle r="5" fill="#ffd8a8" stroke="#212529" stroke-width="1.2"/></g>`;

    arrows += `<g transform="rotate(${ROT[v.f]} 150 150)"><path data-vid="${v.id}" d="${d}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#ah)" opacity=".95"/></g>`;
    cars += `<g transform="rotate(${ROT[v.f]} 150 150)"><g data-car="${v.id}" transform="translate(${x},236)">${body(v)}</g></g>`;

// Na het antwoord rijden de voertuigen in de goede volgorde weg.
function driveScene(svg, order) {
  if (!svg || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  order.forEach((id, n) => setTimeout(() => {
    const car = svg.querySelector(`[data-car="${id}"]`); if (!car || !car.isConnected) return;
    const t0 = performance.now(), dur = 950;
    if (car.dataset.ped) {
      const [x0, y0, x1, y1] = car.dataset.ped.split(',').map(Number);
      const step = now => { const t = Math.min(1, (now - t0) / dur); car.setAttribute('transform', `translate(${x0 + (x1 - x0) * t},${y0 + (y1 - y0) * t})`); if (t < 1 && car.isConnected) requestAnimationFrame(step); };
      return requestAnimationFrame(step);
    }
    const path = svg.querySelector(`path[data-vid="${id}"]`), len = path.getTotalLength(), p0 = path.getPointAtLength(0), pe = path.getPointAtLength(len), pb = path.getPointAtLength(len - 1);
    const ex = pe.x - pb.x, ey = pe.y - pb.y, total = 24 + len + 130;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = t * t * (3 - 2 * t), sdist = -24 + e * total;
      let x, y, ang = 0;
      if (sdist < 0) { x = p0.x; y = p0.y - sdist; }
      else if (sdist > len) { x = pe.x + ex * (sdist - len); y = pe.y + ey * (sdist - len); ang = Math.atan2(ey, ex) * 180 / Math.PI + 90; }
      else { const a = path.getPointAtLength(sdist), b = path.getPointAtLength(Math.min(len, sdist + 1)); x = a.x; y = a.y; ang = sdist + 1 > len ? Math.atan2(ey, ex) * 180 / Math.PI + 90 : Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 90; }
      car.setAttribute('transform', `translate(${x},${y}) rotate(${ang})`);
      if (t < 1 && car.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, 250 + n * 800));
}
const sceneOrder = q => { if (q.order) return q.order; const vs = q.scene.v, first = vs.find(v => q.t === 'mc' && v.n === q.a[q.c]); return first ? [first.id, ...vs.filter(v => v !== first).map(v => v.id)] : []; };

function decoratePaths() {
  let pionPlaced = false, d = 0;
  $app.querySelectorAll('.path').forEach(path => {
    const pts = [...path.querySelectorAll('.node')].map(n => ({ n, x: n.offsetLeft + n.offsetWidth / 2, y: n.offsetTop + n.offsetHeight / 2 + 3 }));
    if (!pts.length) return;
    let dd = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i], m = (a.y + b.y) / 2; dd += `C${a.x} ${m} ${b.x} ${m} ${b.x} ${b.y}`; }
    const W = path.offsetWidth, H = path.offsetHeight;
    path.insertAdjacentHTML('afterbegin', `<svg class="road" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${dd}" fill="none" stroke="#dee2e6" stroke-width="30" stroke-linecap="round"/><path d="${dd}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/></svg>`);
    pts.forEach((p, i) => {
      const side = p.x >= W / 2 ? -1 : 1;                          // decor aan de kant waar ruimte is
      if (!pionPlaced && p.n.classList.contains('now')) { pionPlaced = true;
        path.insertAdjacentHTML('beforeend', `<span class="deco here" style="left:${p.x + side * 92 - 26}px;top:${p.y - 34}px">${pion(52)}</span>`); return; }
      path.insertAdjacentHTML('beforeend', `<span class="deco" style="left:${p.x + side * (96 + (i % 2) * 22) - 14}px;top:${p.y - 20 + (i % 3) * 6}px">${DECO[d++ % DECO.length]}</span>`);
    });
  });
}

function startExam() {

  let pi = 0, qi = 0, deadline = 0, tick = 0, qTimer = 0;
  const isRight = (q, a) => a == null ? false : q.t === 'mc' ? a === q.c : q.t === 'yn' ? a === q.c : q.t === 'num' ? Number(a) === q.c : a.every((id, k) => id === q.order[k]);

    document.getElementById('pgo').onclick = () => { Sound.tap(); if (pi === 1) { deadline = Date.now() + EXAM_MIN * 60000; tick = setInterval(clock, 500); } show(); };

const memoryPairs = t => { const m = (EXTRA[t.id] || []).filter(x => x.t === 'match' && x.pairs.length >= 4); return m.length ? m : null; };

  const cards = shuffle(ex.pairs.slice(0, 4).flatMap((p, k) => [{ k, h: cell(p[0]) }, { k, h: cell(p[1]) }]));
  let open = [], left = 4, moves = 0, busy = false;
  $app.innerHTML = `<div class="lhead"><button class="iconbtn" id="quit" aria-label="Stoppen">✕</button><b style="flex:1">🃏 Memory · ${esc(t.name)}</b><span class="combo" id="moves">0</span></div>
    <div class="qwrap"><h3>Zoek de paren die bij elkaar horen</h3><div class="memory">${cards.map((c, i) => `<button class="mcard" data-i="${i}" aria-label="Kaart"><span class="mi"><span class="mf">?</span><span class="mb">${c.h}</span></span></button>`).join('')}</div></div>`;

  $app.querySelectorAll('.mcard').forEach(b => b.onclick = () => {
    if (busy || b.classList.contains('up')) return;
    b.classList.add('up'); Sound.tap(); open.push(b);
    if (open.length < 2) return;
    document.getElementById('moves').textContent = ++moves;
    const [a, c] = open; open = [];
    if (cards[+a.dataset.i].k === cards[+c.dataset.i].k) { [a, c].forEach(x => x.classList.add('found')); Sound.good();
      if (--left === 0) setTimeout(() => { S.sp[t.id + '_game'] = true; award(15); gameDone('Alle paren gevonden!', `Memory · ${t.name}`, 15, `<div class="card" style="color:var(--blue)"><b>${moves}</b><span>beurten</span></div>`); }, 700);
    } else { busy = true; setTimeout(() => { [a, c].forEach(x => x.classList.remove('up')); busy = false; }, 900); }
  });

}

// ---------- Bliksemronde: zo veel mogelijk goed in 45 seconden ----------
function startBlitz(t) {
  const token = ++screenToken, SECS = 45;
  let pool = [], score = 0, asked = 0, over = false;
  $app.innerHTML = `<div class="lhead"><button class="iconbtn" id="quit" aria-label="Stoppen">✕</button><div class="bar timer"><i style="animation-duration:${SECS}s"></i></div><div class="combo" id="score">⚡ 0</div></div><div class="qwrap" id="qwrap"></div>`;
  document.getElementById('quit').onclick = home;
  const wrap = document.getElementById('qwrap');
  const end = () => { if (over || token !== screenToken) return; over = true;
    const xp = score * 2, best = Math.max(S.best[t.id] || 0, score), rec = score > (S.best[t.id] || 0) && score > 0;
    S.best[t.id] = best; S.sp[t.id + '_game'] = true; award(xp);
    gameDone(rec ? 'Nieuw record! ⚡' : 'Tijd om!', `Bliksemronde · ${t.name}`, xp, `<div class="card" style="color:var(--green-d)"><b>${score}/${asked}</b><span>goed</span></div><div class="card" style="color:#7048e8"><b>${best}</b><span>record</span></div>`); };
  setTimeout(end, SECS * 1000);
  const next = () => {
    if (over || token !== screenToken) return;
    if (!pool.length) pool = shuffle(t.qs.filter(q => q.t === 'mc' || q.t === 'yn'));
    const q = pool.pop();
    const opts = q.t === 'yn' ? [{ a: 'Ja', ok: q.c }, { a: 'Nee', ok: !q.c }] : (q.fixed ? q.a.map((a, i) => ({ a, ok: i === q.c })) : shuffle(q.a.map((a, i) => ({ a, ok: i === q.c }))));
    wrap.classList.remove('dis');
    wrap.innerHTML = `<h3>${esc(q.q)}</h3>${picture(q)}<div class="opts ${q.t === 'yn' ? 'yn' : ''}">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.a)}</button>`).join('')}</div>`;
    wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = opts[+b.dataset.i].ok; asked++; wrap.classList.add('dis');
      b.classList.add(ok ? 'good' : 'bad', ok ? 'pop' : 'shake');
      if (!ok) wrap.querySelector(`.opt[data-i="${opts.findIndex(o => o.ok)}"]`).classList.add('good');
      if (ok) { score++; Sound.good(); document.getElementById('score').textContent = `⚡ ${score}`; } else Sound.bad();
      setTimeout(next, ok ? 380 : 1100);
    });
    scrollTo(0, 0);
  };
  next();
}

// ---------- Theorieboek: categorieën → thema → hoofdstuk / borden / voorbeelden / getallen ----------
const BOOK = window.BOOK || {}, BOOKCATS = window.BOOKCATS || [];
const covered = t => (S.done[t.id] || 0) >= 1;
const answerOf = q => q.t === 'mc' ? q.a[q.c] : q.t === 'yn' ? (q.c ? 'Ja' : 'Nee') : q.t === 'num' ? `${q.c} ${q.unit || ''}` : q.t === 'order' ? q.order.map((id, k) => `${k + 1}. ${q.scene.v.find(v => v.id === id).n}`).join(', ') : '';
const bookImg = im => Array.isArray(im) ? sign(im) : im && im.q && ALL[im.q] && ALL[im.q].scene ? scene(ALL[im.q].scene) : '';
// Wat er per thema te lezen valt, deels afgeleid uit de vragen (borden, uitgewerkte voorbeelden, getallen).
function bookParts(t) {
  const seen = new Set(), signs = [], examples = [], facts = [];
  for (const q of t.qs) {
    if (q.sign && /^Bord /.test(q.e) && !seen.has(q.sign.join())) { seen.add(q.sign.join()); signs.push(q); }
    if (q.t === 'num') facts.push([q.q, answerOf(q)]);
    else if (q.t !== 'order' ? (q.scene || q.sign || t.qs.filter(x => x.scene || x.sign).length < 3) : true) examples.push(q);
  }
  for (const x of EXTRA[t.id] || []) if (x.t === 'match' && x.pairs.every(p => typeof p[0] === 'string')) x.pairs.forEach(p => facts.push([p[0], p[1]]));
  return { chapters: THEORY[t.id] || [], signs, examples: examples.slice(0, 10), facts };
}
function book() {
  const all = THEMES.filter(t => (THEORY[t.id] || []).length), n = all.filter(covered).length;

      ${BOOKCATS.map(c => `<h3 class="cat">${c.icon} ${esc(c.name)}</h3><div class="shelf">${c.themes.map(id => THEMES.find(t => t.id === id)).filter(Boolean).map(t => { const p = bookParts(t);

          <small>${p.chapters.length} hoofdstukken${p.signs.length ? ` · ${p.signs.length} borden` : ''}</small><em>${covered(t) ? '✓ behandeld' : 'komt nog'}</em></button>`; }).join('')}</div>`).join('')}

// ---------- Les ----------
function startLesson(qs, meta) {
  const total = qs.length; let queue = qs.slice(), right = 0, firstTry = 0, combo = 0, xp = 0; const missed = new Set();
  $app.innerHTML = `<div class="lhead"><button class="iconbtn" id="quit" aria-label="Stoppen">✕</button><div class="bar"><i id="bar"></i></div><div class="combo" id="combo"></div></div>
    <div class="qwrap" id="qwrap"></div><div class="sheet" id="sheet"><div></div></div>`;
  document.getElementById('quit').onclick = () => { if (right === 0 || confirm('Stoppen met deze les? Je voortgang van deze les gaat verloren.')) home(); };
  const wrap = document.getElementById('qwrap'), sheet = document.getElementById('sheet');

  const next = () => {
    sheet.className = 'sheet';
    document.getElementById('bar').style.width = (right / total * 100) + '%';
    document.getElementById('combo').textContent = combo >= 2 ? `🔥 ${combo}` : '';
    if (!queue.length) return finish();
    ask(queue.shift());
  };

  const result = (q, ok, correctText) => {
    wrap.classList.add('dis');
    const st = S.q[q.id] || (S.q[q.id] = { r: 0, w: 0 }); st.t = Date.now();
    if (ok) { st.r++; right++; combo++; if (!missed.has(q.id)) { firstTry++; xp += 10; } else xp += 5; Sound.good(); }
    else { st.r = 0; st.w++; combo = 0; missed.add(q.id); queue.push(q); Sound.bad(); }
    save();
    if (q.scene) driveScene(wrap.querySelector('svg.scene'), sceneOrder(q));
    if (ok && [3, 5, 10].includes(combo)) comboToast(combo);
    sheet.className = 'sheet show ' + (ok ? 'good' : 'bad');
    sheet.firstElementChild.innerHTML = `<button class="flag" id="flag">${S.flags.includes(q.id) ? 'gemarkeerd ✓' : 'klopt niet?'}</button>
      <h4>${pion(34, ok ? 'happy' : 'sad')} ${ok ? ['Goed zo!', 'Top!', 'Lekker bezig!', 'Helemaal goed!'][Math.floor(Math.random() * 4)] : 'Helaas…'}</h4>
      <p>${ok || !correctText ? '' : `<b>Goed antwoord: ${esc(correctText)}</b><br>`}${esc(q.e)}</p>
      <button class="btn ${ok ? 'green' : 'red'}" id="go">Verder</button>`;
    document.getElementById('go').onclick = () => { Sound.tap(); next(); };
    document.getElementById('flag').onclick = e => { if (!S.flags.includes(q.id)) { S.flags.push(q.id); save(); } e.target.textContent = 'gemarkeerd ✓'; };
  };

  function ask(q) {
    wrap.classList.remove('dis'); wrap.dataset.qid = q.id;
    let html = `${meta.review && meta.review.has(q.id) ? '<span class="revchip">🔁 Herhaling van eerder</span>' : ''}<h3>${esc(q.q)}</h3>${picture(q)}`;
    if (q.t === 'mc') {
      const opts = q.fixed ? q.a.map((a, i) => ({ a, i })) : shuffle(q.a.map((a, i) => ({ a, i })));
      html += `<div class="opts">${opts.map(o => `<button class="opt" data-i="${o.i}">${esc(o.a)}</button>`).join('')}</div>`
        + (q.a.length >= 3 && inv('hint') > 0 ? `<button class="hintbtn" id="hint">💡 Hint gebruiken (${inv('hint')})</button>` : '');
      wrap.innerHTML = html;
      const hb = document.getElementById('hint');
      if (hb) hb.onclick = () => { S.use.hint = (S.use.hint || 0) + 1; save(); Sound.tap(); hb.remove();
        const wrong = shuffle([...wrap.querySelectorAll('.opt')].filter(o => +o.dataset.i !== q.c))[0]; wrong.classList.add('gone'); wrong.disabled = true; };
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const ok = +b.dataset.i === q.c;
        b.classList.add(ok ? 'good' : 'bad', ok ? 'pop' : 'shake');
        if (!ok) wrap.querySelector(`.opt[data-i="${q.c}"]`).classList.add('good');
        const h = document.getElementById('hint'); if (h) h.remove();
        result(q, ok, q.a[q.c]);
      });
    } else if (q.t === 'yn') {
      html += `<div class="opts yn"><button class="opt" data-v="1">Ja</button><button class="opt" data-v="0">Nee</button></div>`;
      wrap.innerHTML = html;
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const ok = (b.dataset.v === '1') === q.c;

        result(q, ok, q.c ? 'Ja' : 'Nee');
      });
    } else if (q.t === 'num') {
      html += `<div class="numrow"><input id="num" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="?"><span>${esc(q.unit || '')}</span></div>
        <div class="checkbar"><div><button class="btn green" id="check" disabled>Controleer</button></div></div>`;
      wrap.innerHTML = html;
      const inp = document.getElementById('num'), btn = document.getElementById('check');
      inp.oninput = () => { btn.disabled = inp.value.trim() === ''; };
      const go = () => { if (btn.disabled) return; const ok = Number(inp.value) === q.c; inp.blur(); btn.parentElement.parentElement.remove();
        inp.style.borderColor = ok ? 'var(--green)' : 'var(--red)'; result(q, ok, `${q.c} ${q.unit || ''}`); };
      btn.onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };

    } else if (q.t === 'gap') {

      html += `<p class="sentence">${esc(pre)}<span class="blank" id="blank">&nbsp;</span>${esc(post)}</p><div class="chips">${opts.map(o => `<button class="opt chip" data-i="${o.i}">${esc(o.a)}</button>`).join('')}</div>`;
      wrap.innerHTML = html;
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const ok = +b.dataset.i === q.c, blank = document.getElementById('blank');
        blank.textContent = q.a[+b.dataset.i]; blank.classList.add(ok ? 'good' : 'bad'); b.classList.add(ok ? 'good' : 'bad', ok ? 'pop' : 'shake');
        result(q, ok, q.a[q.c]);
      });
    } else if (q.t === 'pick') {
      const opts = shuffle(q.signs.map((sg, i) => ({ sg, i })));

      wrap.innerHTML = html;
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const ok = +b.dataset.i === q.c;
        b.classList.add(ok ? 'good' : 'bad', ok ? 'pop' : 'shake');
        if (!ok) wrap.querySelector(`.opt[data-i="${q.c}"]`).classList.add('good');
        result(q, ok, '');
      });
    } else if (q.t === 'match') {
      const cell = v => typeof v === 'string' ? esc(v) : sign(v.sign);
      const right = shuffle(q.pairs.map((p, k) => ({ v: p[1], k })));
      html += `<div class="match"><div>${q.pairs.map((p, k) => `<button class="opt" data-side="l" data-k="${k}">${cell(p[0])}</button>`).join('')}</div>
        <div>${right.map(r => `<button class="opt" data-side="r" data-k="${r.k}">${cell(r.v)}</button>`).join('')}</div></div>`;
      wrap.innerHTML = html;
      let sel = null, errs = 0, left = q.pairs.length;
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (b.classList.contains('good')) return;
        if (!sel || sel.dataset.side === b.dataset.side) { if (sel) sel.classList.remove('picked'); sel = b; b.classList.add('picked'); Sound.tap(); return; }
        const a = sel; sel = null; a.classList.remove('picked');
        if (a.dataset.k === b.dataset.k) {

          if (--left === 0) result(q, errs === 0, '');
        } else { errs++; [a, b].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); }); Sound.bad(); }
      });
    } else if (q.t === 'bucket') {
      const rows = shuffle(q.items.map((it, k) => ({ text: it[0], k })));
      html += `<div class="bucket">${rows.map(r => `<div class="brow" data-k="${r.k}"><span>${esc(r.text)}</span><div class="bbtns">${q.labels.map((l, j) => `<button class="opt" data-j="${j}">${esc(l)}</button>`).join('')}</div></div>`).join('')}</div>
        <div class="checkbar"><div><button class="btn green" id="check" disabled>Controleer</button></div></div>`;
      wrap.innerHTML = html;
      const btn = document.getElementById('check'), chosen = {};
      wrap.querySelectorAll('.brow').forEach(row => row.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        row.querySelectorAll('.opt').forEach(o => o.classList.remove('picked')); b.classList.add('picked'); chosen[row.dataset.k] = +b.dataset.j; Sound.tap();

      }));
      btn.onclick = () => {
        let ok = true;
        wrap.querySelectorAll('.brow').forEach(row => { const good = q.items[+row.dataset.k][1], mine = chosen[row.dataset.k];
          row.querySelectorAll('.opt').forEach(o => { o.classList.remove('picked'); if (+o.dataset.j === good) o.classList.add('good'); else if (+o.dataset.j === mine) o.classList.add('bad'); });
          if (mine !== good) ok = false; });
        btn.parentElement.parentElement.remove(); result(q, ok, '');
      };
    } else if (q.t === 'seq') {
      const vs = shuffle(q.items.map((text, k) => ({ text, k })));
      html += `<div class="opts">${vs.map(v => `<button class="opt" data-k="${v.k}">${esc(v.text)}</button>`).join('')}</div>`;
      wrap.innerHTML = html;
      const picked = [];
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (picked.includes(+b.dataset.k)) return;
        picked.push(+b.dataset.k); Sound.tap();
        b.classList.add('picked'); b.innerHTML = `<span class="n">${picked.length}</span>` + b.innerHTML;
        if (picked.length === q.items.length) {
          const ok = picked.every((k, i) => k === i);
          wrap.querySelectorAll('.opt').forEach(o => { o.classList.remove('picked'); o.classList.add(ok ? 'good' : 'bad'); });
          result(q, ok, q.items.map((t, i) => `${i + 1}. ${t}`).join(' '));
        }
      });
    } else if (q.t === 'order') {
      const vs = shuffle(q.scene.v);
      html += `<div class="opts">${vs.map(v => `<button class="opt" data-id="${v.id}">${esc(v.n)}</button>`).join('')}</div>`;
      wrap.innerHTML = html;
      const picked = [];
      wrap.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if (picked.includes(b.dataset.id)) return;
        picked.push(b.dataset.id); Sound.tap();
        b.classList.add('picked'); b.innerHTML = `<span class="n">${picked.length}</span>` + b.innerHTML;
        if (picked.length === q.order.length) {
          const ok = picked.every((id, i) => id === q.order[i]);
          wrap.querySelectorAll('.opt').forEach(o => { o.classList.remove('picked'); o.classList.add(ok ? 'good' : 'bad'); });
          result(q, ok, q.order.map((id, i) => `${i + 1}. ${q.scene.v.find(v => v.id === id).n}`).join(', '));
        }
      });
    }
    scrollTo(0, 0);
  }

  function finish() {
    const perfect = missed.size === 0; if (perfect) xp += 5;
    const dbl = inv('dbl') > 0; if (dbl) { xp *= 2; S.use.dbl = (S.use.dbl || 0) + 1; }
    S.xp += xp; S.days[dayKey()] = todayXp() + xp;
    if (meta.theme) { S.done[meta.theme.id] = Math.max(S.done[meta.theme.id] || 0, meta.index + 1); S.last = meta.theme.id; }
    save(); Sound.win(); confetti();
    $app.innerHTML = `<div class="finish">${pion(120, 'excited')}
      <h2>${perfect ? 'Foutloos! 🌟' : 'Les gehaald!'}</h2>
      <div style="color:var(--soft)">${esc(meta.title)}</div>
      <div class="cards"><div class="card" style="color:var(--gold)"><b id="xpn">+0</b><span>${dbl ? 'XP · dubbel!' : 'XP'}</span></div>
        <div class="card" style="color:var(--green-d)"><b>${Math.round(firstTry / total * 100)}%</b><span>in één keer goed</span></div>
        <div class="card" style="color:#f76707"><b>🔥 ${streak()}</b><span>dagen op rij</span></div></div>
      <button class="btn green" id="back" style="max-width:320px">Verder</button></div>`;
    countUp(document.getElementById('xpn'), xp);
    document.getElementById('back').onclick = home;
  }
  next();
}

function confetti() {
  const cols = ['#fab005', '#40c057', '#1c7ed6', '#fa5252', '#7048e8', '#ff922b'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i'); c.className = 'conf';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % cols.length]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s;border-radius:${Math.random() < .5 ? '50%' : '2px'}`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}

// #overzicht: alle plaatjes op één pagina (om de tekeningen na te kijken)
if (location.hash === '#overzicht') {
  $app.style.maxWidth = 'none';
  $app.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:8px">' + Object.values(ALL).filter(q => q.sign || q.signs || q.scene)
    .map(q => `<div style="width:${q.scene ? 200 : 120}px;font:600 10px/1.2 sans-serif;text-align:center">${picture(q)}${q.id} ${q.sign ? q.sign[0] : ''}</div>`).join('') + '</div>';
} else { applyFreeze(); home(); pull(); }
})();
</script>
